
name: Compilar STK Chest Counter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar repositório
      - name: Baixar arquivos
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Android SDK atualizado
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. Instalar componentes necessários do Android
      - name: Instalar SDK Android 35
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Configurar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Extrair projeto
      - name: Extrair projeto
        run: |
          mkdir -p extracted
          unzip -q ChestCounterV2.zip -d extracted

      # 7. Encontrar pasta Android automaticamente
      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android não encontrado!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. Compilar aplicativo
      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            assembleDebug

      # 9. Verificar APK
      - name: Verificar APK
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      # 10. Disponibilizar APK
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
