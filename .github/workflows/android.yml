
name: Compilar STK Chest Counter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar SDK Android 35
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Procura ZIP ou utiliza os arquivos diretamente
      - name: Preparar projeto
        shell: bash
        run: |
          mkdir -p extracted

          ZIP_FILE=""

          if [ -f "ChestCounterV2.zip" ]; then
            ZIP_FILE="ChestCounterV2.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 \
              -type f -name '*.zip' \
              -not -path './.git/*' \
              -print -quit)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Extraindo: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted
          else
            echo "Nenhum ZIP encontrado."
            echo "Procurando projeto diretamente no repositório."
          fi

      # Localiza settings.gradle automaticamente
      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            echo "Arquivos disponíveis:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            assembleDebug

      - name: Verificar APK
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
